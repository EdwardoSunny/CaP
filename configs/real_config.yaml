lmp_config:
  env:
    map_size: 100
    max_plan_iter: 1
    visualize: true
  lmps:
    tabletop_ui:
      prompt_fname: tabletop_ui_prompt
      model: gpt-5-nano
      # To use a local vLLM model instead, uncomment below:
      # model: Qwen/Qwen3.5-27B-FP8
      # api_mode: chat_completions
      # base_url: http://scai3.cs.ucla.edu:8000/v1
      # api_key: not-needed
      max_tokens: 16384
      temperature: 0
      query_prefix: "# Query: "
      query_suffix: "."
      stop:
        - "# Query: "
        - "objects = "
      maintain_session: false
      include_context: false
      has_return: false
      return_val_name: ret_val
      load_cache: true
      debug_mode: false
      output_format: python

    tabletop_ui_json:
      prompt_fname: tabletop_ui_json_prompt
      model: gpt-5-nano
      max_tokens: 4096
      temperature: 0
      query_prefix: "# Query: "
      query_suffix: "."
      stop:
        - "# Query: "
        - "objects = "
      maintain_session: false
      include_context: false
      has_return: false
      return_val_name: ret_val
      load_cache: true
      debug_mode: false
      output_format: json_actions
      action_map_fname: action_map
      strict_actions: false
    
    parse_obj_name:
      prompt_fname: parse_obj_name_prompt
      model: gpt-5-nano
      max_tokens: 16384 
      temperature: 0
      query_prefix: "# "
      query_suffix: "."
      stop:
        - "#"
        - "objects = ["
      maintain_session: false
      include_context: true
      has_return: true
      return_val_name: ret_val
      debug_mode: true 

    parse_position:
      prompt_fname: parse_position_prompt
      model: gpt-5-nano
      max_tokens: 16384 
      temperature: 0
      query_prefix: "# "
      query_suffix: "."
      stop:
        - "#"
      maintain_session: false
      include_context: true
      has_return: true
      return_val_name: ret_val
      debug_mode: true 

    parse_question:
      prompt_fname: parse_question_prompt
      model: gpt-5-nano
      max_tokens: 16384 
      temperature: 0
      query_prefix: "# "
      query_suffix: "."
      stop:
        - "#"
        - "objects = ["
      maintain_session: false
      include_context: true
      has_return: true
      return_val_name: ret_val
      debug_mode: true 

    transform_shape_pts:
      prompt_fname: transform_shape_pts_prompt
      model: gpt-5-nano
      max_tokens: 16384 
      temperature: 0
      query_prefix: "# "
      query_suffix: "."
      stop:
        - "#"
      maintain_session: false
      include_context: true
      has_return: true
      return_val_name: new_shape_pts
      debug_mode: true 

    fgen:
      prompt_fname: fgen_prompt
      model: gpt-5-nano
      max_tokens: 16384
      temperature: 0
      query_prefix: "# define function: "
      query_suffix: "."
      stop:
        - "# define"
        - "# example"
      maintain_session: false
      include_context: false
      return_val_name: ret_val
      load_cache: true
      debug_mode: true 
